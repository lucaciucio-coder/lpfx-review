<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPFX Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06080D;
    --bg2: #0C1018;
    --bg3: #111820;
    --border: #1E2530;
    --border2: #2A3340;
    --teal: #00D4AA;
    --teal-dim: rgba(0,212,170,0.12);
    --teal-dim2: rgba(0,212,170,0.06);
    --gold: #F0A500;
    --red: #FF4D4D;
    --blue: #4D9EFF;
    --text: #E8EDF2;
    --text2: #8A9BB0;
    --text3: #4A5568;
    --win: #00D4AA;
    --loss: #FF4D4D;
    --partial: #4D9EFF;
    --be: #F0A500;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .login-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--teal);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  .login-subtitle {
    color: var(--text2);
    font-size: 13px;
    margin-bottom: 36px;
  }

  .login-card label {
    display: block;
    text-align: left;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .login-card input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }

  .login-card input:focus { border-color: var(--teal); }

  .btn-primary {
    width: 100%;
    background: var(--teal);
    color: #06080D;
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-primary:hover { opacity: 0.88; }

  .login-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* ── APP SHELL ── */
  #app { display: none; }

  .topbar {
    height: 56px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    color: var(--teal);
    letter-spacing: 0.08em;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topbar-user {
    font-size: 13px;
    color: var(--text2);
  }

  .btn-logout {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-logout:hover { border-color: var(--teal); color: var(--teal); }

  .main-content {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* ── TABS (ADMIN) ── */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 28px;
  }

  .tab-btn {
    flex: 1;
    padding: 8px 16px;
    border: none;
    background: none;
    color: var(--text2);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: var(--teal-dim);
    color: var(--teal);
  }

  /* ── TRADE CARD ── */
  .trades-grid { display: flex; flex-direction: column; gap: 16px; }

  .trade-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .trade-card:hover { border-color: var(--border2); }

  .trade-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }

  .trade-meta { display: flex; align-items: center; gap: 12px; }

  .trade-pair {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
  }

  .trade-dir {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .trade-dir.buy { background: rgba(0,212,170,0.15); color: var(--teal); }
  .trade-dir.sell { background: rgba(255,77,77,0.15); color: var(--red); }

  .trade-result {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .trade-result.win { background: rgba(0,212,170,0.15); color: var(--win); }
  .trade-result.loss { background: rgba(255,77,77,0.15); color: var(--loss); }
  .trade-result.partial { background: rgba(77,158,255,0.15); color: var(--partial); }
  .trade-result.be { background: rgba(240,165,0,0.15); color: var(--be); }

  .trade-date {
    font-size: 12px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }

  .trade-card-body { padding: 18px 20px; }

  .trade-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-item { }

  .stat-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .trade-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

  .trade-field-row { display: flex; gap: 8px; }

  .field-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    min-width: 100px;
    flex-shrink: 0;
    padding-top: 1px;
  }

  .field-value {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
  }

  /* Immagini */
  .trade-images {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .trade-img-wrap {
    position: relative;
    cursor: pointer;
  }

  .trade-img-wrap img {
    width: 100px;
    height: 70px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }

  .trade-img-wrap:hover img { border-color: var(--teal); }

  .img-tf-label {
    position: absolute;
    bottom: 4px;
    left: 4px;
    background: rgba(6,8,13,0.85);
    color: var(--teal);
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 5px;
    border-radius: 3px;
  }

  /* Reazioni */
  .reactions-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .reaction-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    color: var(--text2);
    font-family: 'Inter', sans-serif;
  }

  .reaction-btn:hover { border-color: var(--teal); background: var(--teal-dim2); }
  .reaction-btn.selected { border-color: var(--teal); background: var(--teal-dim); }

  .reaction-count {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text2);
  }

  /* Domande */
  .questions-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .questions-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .qa-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .qa-question {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .qa-answer {
    font-size: 13px;
    color: var(--teal);
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }

  .qa-answer-label {
    font-size: 10px;
    color: var(--teal);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .ask-question-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .ask-question-area input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .ask-question-area input:focus { border-color: var(--teal); }

  .btn-ask {
    background: var(--teal-dim);
    border: 1px solid var(--teal);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    color: var(--teal);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-ask:hover { background: var(--teal); color: #06080D; }

  /* ── ADMIN SPECIFICO ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .page-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    background: rgba(240,165,0,0.15);
    color: var(--gold);
    border: 1px solid rgba(240,165,0,0.3);
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .badge.teal {
    background: var(--teal-dim);
    color: var(--teal);
    border-color: rgba(0,212,170,0.3);
  }

  /* Trade in coda admin */
  .admin-trade-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
  }

  .admin-trade-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .admin-actions { display: flex; gap: 8px; }

  .btn-approve {
    background: rgba(0,212,170,0.12);
    border: 1px solid var(--teal);
    border-radius: 6px;
    padding: 7px 14px;
    color: var(--teal);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-approve:hover { background: var(--teal); color: #06080D; }

  .btn-reject {
    background: rgba(255,77,77,0.08);
    border: 1px solid rgba(255,77,77,0.4);
    border-radius: 6px;
    padding: 7px 14px;
    color: var(--red);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-reject:hover { background: var(--red); color: #fff; }

  .btn-publish {
    background: rgba(240,165,0,0.12);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 7px 14px;
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-publish:hover { background: var(--gold); color: #06080D; }

  .btn-unpublish {
    background: rgba(77,158,255,0.08);
    border: 1px solid rgba(77,158,255,0.4);
    border-radius: 6px;
    padding: 7px 14px;
    color: var(--blue);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  /* Gestione utenti */
  .user-table {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .user-table-head {
    display: grid;
    grid-template-columns: 1fr 1fr 120px 100px;
    padding: 12px 20px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }

  .user-row {
    display: grid;
    grid-template-columns: 1fr 1fr 120px 100px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
  }

  .user-row:last-child { border-bottom: none; }
  .user-row:hover { background: var(--teal-dim2); }

  .user-email { font-size: 13px; color: var(--text); }
  .user-nome { font-size: 13px; color: var(--text2); }
  .user-pin { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text3); }

  .btn-delete-user {
    background: none;
    border: 1px solid rgba(255,77,77,0.3);
    border-radius: 5px;
    padding: 4px 10px;
    color: var(--red);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-delete-user:hover { background: rgba(255,77,77,0.1); }

  /* Add user form */
  .add-user-form {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 140px auto;
    gap: 10px;
    align-items: end;
  }

  .form-group label {
    display: block;
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 5px;
    font-weight: 600;
  }

  .form-group input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group input:focus { border-color: var(--teal); }

  /* Domande admin */
  .question-admin-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
  }

  .qa-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .qa-trade-ref {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--teal);
    background: var(--teal-dim);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .qa-user-ref {
    font-size: 12px;
    color: var(--text3);
  }

  .qa-question-text {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .answer-area {
    display: flex;
    gap: 8px;
  }

  .answer-area textarea {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
    min-height: 70px;
  }

  .answer-area textarea:focus { border-color: var(--teal); }

  .answer-actions { display: flex; flex-direction: column; gap: 6px; }

  .btn-answer {
    background: var(--teal-dim);
    border: 1px solid var(--teal);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--teal);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }

  .btn-answer:hover { background: var(--teal); color: #06080D; }

  .btn-make-public {
    background: rgba(240,165,0,0.1);
    border: 1px solid rgba(240,165,0,0.4);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }

  .btn-make-public:hover { background: var(--gold); color: #06080D; }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6,8,13,0.95);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }

  #lightbox.open { display: flex; }

  #lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text2);
    font-size: 18px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }

  .empty-state-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state-title { font-size: 16px; color: var(--text2); margin-bottom: 6px; }
  .empty-state-sub { font-size: 13px; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg2);
    border: 1px solid var(--teal);
    border-radius: var(--radius-sm);
    padding: 12px 18px;
    color: var(--teal);
    font-size: 13px;
    font-weight: 500;
    z-index: 1000;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
  }

  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.error { border-color: var(--red); color: var(--red); }

  /* Divider */
  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  /* Sync button */
  .btn-sync {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-sync:hover { border-color: var(--teal); color: var(--teal); }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    display: inline-block;
  }

  .admin-section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-pill {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }

  .answered-badge {
    font-size: 11px;
    background: rgba(0,212,170,0.12);

<script>
const SUPABASE_URL = 'https://qnngkycecbmaasxopors.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4IhbL_7r3fudE9dxFuiWZg_wH3Wfw1R';

let currentUser = null;

// ── API ──────────────────────────────────────────────
async function sb(path, opts = {}, useKey = SUPABASE_KEY) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: {
      'apikey': useKey,
      'Authorization': 'Bearer ' + useKey,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok && res.status !== 204) {
    const err = await res.text();
    throw new Error(err);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ── TOAST ────────────────────────────────────────────
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => el.className = '', 2800);
}

// ── LOGIN ────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pin = document.getElementById('login-pin').value.trim();
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  if (!email || !pin) { errEl.style.display = 'block'; errEl.textContent = 'Inserisci email e PIN'; return; }

  try {
    const users = await sb(`review_users?email=eq.${encodeURIComponent(email)}&select=*`);
    if (!users || users.length === 0 || users[0].pin !== pin) {
      errEl.style.display = 'block';
      errEl.textContent = 'Email o PIN non corretti';
      return;
    }
    currentUser = users[0];
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('topbar-user').textContent = currentUser.nome || currentUser.email;
    if (currentUser.is_admin) {
      document.getElementById('view-admin').style.display = 'block';
      loadAdminPending();
    } else {
      document.getElementById('view-user').style.display = 'block';
      loadUserTrades();
    }
  } catch(e) {
    errEl.style.display = 'block';
    errEl.textContent = 'Errore di connessione';
  }
}

document.getElementById('logout-btn').addEventListener('click', () => {

// ── HELPERS ──────────────────────────────────────────
function resultClass(r) {
  if (!r) return '';
  const m = { win: 'win', loss: 'loss', parziale: 'partial', be: 'be' };
  return m[r.toLowerCase()] || '';
}

function resultLabel(r) {
  if (!r) return '-';
  const m = { win: 'WIN', loss: 'LOSS', parziale: 'PARZIALE', be: 'B/E' };
  return m[r.toLowerCase()] || r.toUpperCase();
}

function fmtDate(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return dt.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
}

function buildImagesHtml(immagini, clickable = true) {
  if (!immagini || immagini.length === 0) return '';
  return `<div class="trade-images">
    ${immagini.map(img => {
      const src = img.url || img.src || '';
      if (!src) return '';
      return `<div class="trade-img-wrap" ${clickable ? `data-src="${src}"` : ''}>
        <img src="${src}" alt="${img.tf || ''}">
        ${img.tf ? `<div class="img-tf-label">${img.tf}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function buildFieldsHtml(t) {
  const fields = [
    ['Setup', t.setup],
    ['TF Entry', t.tf_entry],
    ['TF Analisi', t.tf_analisi],
    ['Motivo Entry', t.motivo_entry],
    ['Stop Loss', t.stop_loss],
    ['TP / Gestione', t.tp_gestione],
    ['Errori / Lezioni', t.errori_lezioni],
    ['Stato Emotivo', t.stato_emotivo],
    ['Note', t.altro],
  ].filter(([, v]) => v);
  if (!fields.length) return '';
  return `<div class="trade-fields">
    ${fields.map(([label, value]) => `
      <div class="trade-field-row">
        <div class="field-label">${label}</div>
        <div class="field-value">${value}</div>
      </div>
    `).join('')}
  </div>`;
}

// ── VIEW UTENTE ──────────────────────────────────────
async function loadUserTrades() {
  const list = document.getElementById('user-trades-list');
  list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-title">Caricamento...</div></div>';
  try {
    const trades = await sb('review_trades?pubblicato=eq.true&order=data.desc&select=*');
    if (!trades || trades.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">Nessun trade ancora pubblicato</div><div class="empty-state-sub">Torna presto</div></div>';
      return;
    }
    list.innerHTML = '';
    for (const t of trades) {
      const reactions = await sb(`review_reactions?trade_id=eq.${t.id}&select=emoji,user_id`);
      const myReaction = reactions.find(r => r.user_id === currentUser.id);
      const counts = { '💪': 0, '🔥': 0, '👍': 0 };
      reactions.forEach(r => { if (counts[r.emoji] !== undefined) counts[r.emoji]++; });

      const questions = await sb(`review_questions?trade_id=eq.${t.id}&pubblica=eq.true&select=*`);
      const myQ = await sb(`review_questions?trade_id=eq.${t.id}&user_id=eq.${currentUser.id}&select=*`);

      list.appendChild(buildUserTradeCard(t, counts, myReaction, questions, myQ));
    }
  } catch(e) {
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-title">Errore caricamento</div></div>';
  }
}

// Cache trade data per la modale
const tradeCache = {};

function buildUserTradeCard(t, counts, myReaction, publicQAs, myQAs) {
  tradeCache[t.id] = { t, counts, myReaction, publicQAs, myQAs };

  const card = document.createElement('div');

  card.dataset.tradeId = t.id;

  const emojis = ['💪', '🔥', '👍'];

  card.innerHTML = `
    <div class="trade-card-header" data-open="${t.id}">
      <div class="trade-meta">
        <div class="trade-pair">${t.pair || '-'}</div>
        <div class="trade-dir ${(t.direzione||'').toLowerCase() === 'buy' ? 'buy' : 'sell'}">${t.direzione || '-'}</div>

      <div style="text-align:right">

    <div class="trade-card-body">

          <div class="stat-value">${t.rr || '-'}</div>

          <div class="stat-value">${t.tf_entry || '-'}</div>

      </div>
      ${hasImages ? `<div style="font-size:12px;color:var(--text3);margin-bottom:8px">📸 ${t.immagini.length} grafico${t.immagini.length > 1 ? 'i' : ''} — clicca per vedere</div>` : ''}
      <div class="reactions-row">

    <div class="modal-stats">
      <div class="modal-stat">
        <div class="stat-label">Data</div>
        <div class="stat-value" style="font-size:14px">${fmtDate(t.data)}</div>
      </div>
      <div class="modal-stat">
        <div class="stat-label">P&L</div>
        <div class="stat-value" style="color:${parseFloat(t.pnl) >= 0 ? 'var(--teal)' : 'var(--red)'}">${t.pnl !== null && t.pnl !== undefined ? (parseFloat(t.pnl) > 0 ? '+' : '') + t.pnl + '$' : '-'}</div>
      </div>
      <div class="modal-stat">
        <div class="stat-label">R:R</div>
        <div class="stat-value">${t.rr || '-'}</div>
      </div>
      <div class="modal-stat">
        <div class="stat-label">TF Entry</div>
        <div class="stat-value">${t.tf_entry || '-'}</div>
      </div>
    </div>
    ${immaginiHtml}
    ${fieldsHtml}
    <div class="modal-reactions">
      ${emojis.map(e => `
        <button class="reaction-btn ${myReaction && myReaction.emoji === e ? 'selected' : ''}" data-emoji="${e}" data-trade="${t.id}" data-modal="1">
          ${e} <span class="reaction-count">${counts[e] || 0}</span>
        </button>
      `).join('')}
    </div>
    ${qasHtml}
  `;

  // Immagini aprono lightbox
  document.querySelectorAll('.modal-img-wrap[data-src]').forEach(wrap => {
    wrap.addEventListener('click', () => {
      document.getElementById('lightbox-img').src = wrap.dataset.src;
      document.getElementById('lightbox').classList.add('open');
    });
  });

  // Reazioni nel modale
  document.querySelectorAll('.reaction-btn[data-modal]').forEach(btn => {
    btn.addEventListener('click', () => handleReaction(btn, t.id));
  });

  // Domanda nel modale
  const askInput = document.querySelector('.modal-ask-input');
  const askBtn = document.querySelector('.modal-ask-btn');
  if (askBtn) {
    askBtn.addEventListener('click', () => sendQuestion(t.id, askInput.value.trim(), askInput));
  }
  if (askInput) {
    askInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendQuestion(t.id, e.target.value.trim(), e.target);
    });
  }

  document.getElementById('trade-modal').classList.add('open');
}

async function handleReaction(btn, tradeId) {
  const emoji = btn.dataset.emoji;
  const card = btn.closest('.trade-card');
  const isSelected = btn.classList.contains('selected');

  try {
    if (isSelected) {
      await sb(`review_reactions?trade_id=eq.${tradeId}&user_id=eq.${currentUser.id}`, {
        method: 'DELETE', prefer: 'return=minimal', headers: { 'Prefer': 'return=minimal' }
      });
      btn.classList.remove('selected');
      const countEl = btn.querySelector('.reaction-count');
      countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
    } else {
      // Rimuovi reazione precedente
      const prev = card.querySelector('.reaction-btn.selected');
      if (prev) {
        await sb(`review_reactions?trade_id=eq.${tradeId}&user_id=eq.${currentUser.id}`, {
          method: 'DELETE', prefer: 'return=minimal', headers: { 'Prefer': 'return=minimal' }
        });
        const prevCount = prev.querySelector('.reaction-count');
        prevCount.textContent = Math.max(0, parseInt(prevCount.textContent) - 1);
        prev.classList.remove('selected');
      }
      await sb('review_reactions', {
        method: 'POST',
        body: { trade_id: tradeId, user_id: currentUser.id, emoji },
        prefer: 'return=minimal',
        headers: { 'Prefer': 'return=minimal' }
      });
      btn.classList.add('selected');
      const countEl = btn.querySelector('.reaction-count');
      countEl.textContent = parseInt(countEl.textContent) + 1;
    }
  } catch(e) { toast('Errore reazione', true); }
}

async function sendQuestion(tradeId, text, input) {
  if (!text) return;
  try {
    await sb('review_questions', {
      method: 'POST',
      body: { trade_id: tradeId, user_id: currentUser.id, domanda: text },
      headers: { 'Prefer': 'return=minimal' }
    });
    input.value = '';
    toast('Domanda inviata ✓');
  } catch(e) { toast('Errore invio domanda', true); }
}

// ── ADMIN ────────────────────────────────────────────
// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-pending').style.display = tab === 'pending' ? 'block' : 'none';
    document.getElementById('tab-published').style.display = tab === 'published' ? 'block' : 'none';
    document.getElementById('tab-questions').style.display = tab === 'questions' ? 'block' : 'none';
    document.getElementById('tab-users').style.display = tab === 'users' ? 'block' : 'none';
    if (tab === 'pending') loadAdminPending();
    if (tab === 'published') loadAdminPublished();
    if (tab === 'questions') loadAdminQuestions();
    if (tab === 'users') loadUsers();
  });
});

// Sync dal journal
document.getElementById('sync-btn').addEventListener('click', syncFromJournal);

async function syncFromJournal() {
  const btn = document.getElementById('sync-btn');
  btn.textContent = '⟳ Sincronizzazione...';
  btn.disabled = true;
  try {
    // Prendi tutti i trade dal journal NON setup
    const journalTrades = await sb(
      'journal_trades?is_setup=eq.false&order=created_at.desc',
      {}, LEGACY_KEY
    );

    if (!journalTrades || journalTrades.length === 0) {
      toast('Nessun trade trovato nel journal');
      return;
    }

    // Prendi gli id già importati
    const existing = await sb('review_trades?select=journal_trade_id');
    const existingIds = new Set(existing.map(e => String(e.journal_trade_id)));

    let newCount = 0;
    for (const jt of journalTrades) {
      const jid = String(jt.id);
      if (existingIds.has(jid)) continue;

      // Normalizza immagini base64: {src, tf} → {url, tf}
      let immagini = [];
      if (jt.images && Array.isArray(jt.images)) {
        immagini = jt.images.map(img => ({
          url: img.src || img.url || '',
          tf: img.tf || img.label || ''
        }));
      }

      const payload = {
        journal_trade_id: jid,
        pair: jt.pair || null,
        data: jt.date || null,
        direzione: jt.direction || null,
        risultato: jt.result || null,
        pnl: (jt.pnl !== undefined && jt.pnl !== null) ? jt.pnl : null,
        rr: jt.rr || null,
        setup: jt.setup || null,
        tf_entry: jt.tf || null,
        tf_analisi: jt.tf_analysis || null,
        motivo_entry: jt.entry || null,
        stop_loss: jt.sl || null,
        tp_gestione: jt.tp || null,
        errori_lezioni: jt.lesson || null,
        stato_emotivo: jt.emotion || null,
        altro: jt.altro || null,
        immagini: immagini,
        approvato: false,
        pubblicato: false
      };

      await sb('review_trades', {
        method: 'POST',
        body: payload,
        headers: { 'Prefer': 'return=minimal' }
      });
      newCount++;
    }

    toast(newCount > 0 ? `${newCount} trade importati ✓` : 'Tutto già aggiornato');
    loadAdminPending();
  } catch(e) {
    toast('Errore sync: ' + e.message, true);
  } finally {
    btn.textContent = '⟳ Sincronizza Journal';
    btn.disabled = false;
  }
}

async function loadAdminPending() {
  const list = document.getElementById('pending-list');
  list.innerHTML = '';
  try {
    const trades = await sb('review_trades?approvato=eq.false&order=created_at.desc&select=*');
    document.getElementById('pending-count').textContent = trades.length;
    if (!trades.length) {
      list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><div class="empty-state-title">Nessun trade in attesa</div><div class="empty-state-sub">Sincronizza dal journal per importarne di nuovi</div></div>';
      return;
    }
    trades.forEach(t => list.appendChild(buildAdminPendingCard(t)));
  } catch(e) { toast('Errore caricamento', true); }
}

function buildAdminPendingCard(t) {
  const card = document.createElement('div');
  card.className = 'admin-trade-card';
  card.dataset.id = t.id;

  card.innerHTML = `
    <div class="admin-trade-header">
      <div class="trade-meta">
        <div class="trade-pair">${t.pair || '-'}</div>
        <div class="trade-dir ${t.direzione === 'buy' ? 'buy' : 'sell'}">${t.direzione || '-'}</div>
        <div class="trade-result ${resultClass(t.risultato)}">${resultLabel(t.risultato)}</div>
        <div class="trade-date">${fmtDate(t.data)}</div>
      </div>
      <div class="admin-actions">
        <button class="btn-approve" data-id="${t.id}">✓ Approva</button>
        <button class="btn-reject" data-id="${t.id}">✕ Scarta</button>
      </div>
    </div>
    <div class="trade-stats" style="margin-bottom:0">
      <div class="stat-item"><div class="stat-label">P&L</div><div class="stat-value">${t.pnl ? t.pnl + '$' : '-'}</div></div>
      <div class="stat-item"><div class="stat-label">R:R</div><div class="stat-value">${t.rr || '-'}</div></div>
      <div class="stat-item"><div class="stat-label">Setup</div><div class="stat-value" style="font-family:Inter">${t.setup || '-'}</div></div>
    </div>
    ${buildImagesHtml(t.immagini, false)}
  `;

  card.querySelector('.btn-approve').addEventListener('click', async () => {
    try {
      await sb(`review_trades?id=eq.${t.id}`, {
        method: 'PATCH',
        body: { approvato: true },
        headers: { 'Prefer': 'return=minimal' }
      });
      card.remove();
      toast('Trade approvato ✓');
      const cnt = document.getElementById('pending-count');
      cnt.textContent = Math.max(0, parseInt(cnt.textContent) - 1);
    } catch(e) { toast('Errore', true); }
  });

  card.querySelector('.btn-reject').addEventListener('click', async () => {
    if (!confirm('Scartare questo trade?')) return;
    try {
      await sb(`review_trades?id=eq.${t.id}`, {
        method: 'DELETE',
        headers: { 'Prefer': 'return=minimal' }
      });
      card.remove();
      toast('Trade scartato');
      const cnt = document.getElementById('pending-count');
      cnt.textContent = Math.max(0, parseInt(cnt.textContent) - 1);
    } catch(e) { toast('Errore', true); }
  });

  return card;
}

async function loadAdminPublished() {
  const list = document.getElementById('published-list');
  list.innerHTML = '';
  try {
    const trades = await sb('review_trades?approvato=eq.true&order=data.desc&select=*');
    document.getElementById('published-count').textContent = trades.length;
    if (!trades.length) {
      list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">Nessun trade approvato</div></div>';
      return;
    }
    trades.forEach(t => list.appendChild(buildAdminPublishedCard(t)));
  } catch(e) { toast('Errore caricamento', true); }
}

function buildAdminPublishedCard(t) {
  const card = document.createElement('div');
  card.className = 'admin-trade-card';
  card.dataset.id = t.id;

  card.innerHTML = `
    <div class="admin-trade-header">
      <div class="trade-meta">
        <div class="trade-pair">${t.pair || '-'}</div>
        <div class="trade-dir ${t.direzione === 'buy' ? 'buy' : 'sell'}">${t.direzione || '-'}</div>
        <div class="trade-result ${resultClass(t.risultato)}">${resultLabel(t.risultato)}</div>
        <div class="trade-date">${fmtDate(t.data)}</div>
        ${t.pubblicato ? '<span class="badge teal">Visibile</span>' : '<span class="badge">Nascosto</span>'}
      </div>
      <div class="admin-actions">
        ${t.pubblicato
          ? `<button class="btn-unpublish" data-id="${t.id}">Nascondi</button>`
          : `<button class="btn-publish" data-id="${t.id}">Pubblica</button>`
        }
      </div>
    </div>
    <div class="trade-stats" style="margin-bottom:0">
      <div class="stat-item"><div class="stat-label">P&L</div><div class="stat-value">${t.pnl ? t.pnl + '$' : '-'}</div></div>
      <div class="stat-item"><div class="stat-label">R:R</div><div class="stat-value">${t.rr || '-'}</div></div>
      <div class="stat-item"><div class="stat-label">Setup</div><div class="stat-value" style="font-family:Inter">${t.setup || '-'}</div></div>
    </div>
  `;

  const btn = card.querySelector('.btn-publish, .btn-unpublish');
  if (btn) {
    btn.addEventListener('click', async () => {
      const newVal = btn.classList.contains('btn-publish');
      try {
        await sb(`review_trades?id=eq.${t.id}`, {
          method: 'PATCH',
          body: { pubblicato: newVal },
          headers: { 'Prefer': 'return=minimal' }
        });
        toast(newVal ? 'Trade pubblicato ✓' : 'Trade nascosto');
        loadAdminPublished();
      } catch(e) { toast('Errore', true); }
    });
  }

  return card;
}

async function loadAdminQuestions() {
  const list = document.getElementById('questions-list');
  list.innerHTML = '';
  try {
    const qs = await sb('review_questions?order=created_at.desc&select=*');
    document.getElementById('questions-count').textContent = qs.length;
    if (!qs.length) {
      list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-title">Nessuna domanda ancora</div></div>';
      return;
    }

    // Prendi i trade per ref
    const tradeIds = [...new Set(qs.map(q => q.trade_id))];
    const trades = await sb(`review_trades?id=in.(${tradeIds.join(',')})&select=id,pair,data`);
    const tradeMap = Object.fromEntries(trades.map(t => [t.id, t]));

    // Prendi gli utenti
    const userIds = [...new Set(qs.map(q => q.user_id))];
    const users = await sb(`review_users?id=in.(${userIds.join(',')})&select=id,nome,email`);
    const userMap = Object.fromEntries(users.map(u => [u.id, u]));

    qs.forEach(q => list.appendChild(buildQuestionAdminCard(q, tradeMap[q.trade_id], userMap[q.user_id])));
  } catch(e) { toast('Errore caricamento', true); }
}

function buildQuestionAdminCard(q, trade, user) {
  const card = document.createElement('div');
  card.className = 'question-admin-card';

  card.innerHTML = `
    <div class="qa-meta">
      ${trade ? `<span class="qa-trade-ref">${trade.pair || '?'} ${fmtDate(trade.data)}</span>` : ''}
      <span class="qa-user-ref">${user ? (user.nome || user.email) : 'Utente'}</span>
      ${q.risposta ? '<span class="answered-badge">Risposto</span>' : ''}
      ${q.pubblica ? '<span class="public-badge">Pubblica</span>' : ''}
    </div>
    <div class="qa-question-text">${q.domanda}</div>
    ${q.risposta ? `<div class="qa-answer" style="margin-bottom:10px"><div class="qa-answer-label">Tua risposta</div>${q.risposta}</div>` : ''}
    <div class="answer-area">
      <textarea placeholder="${q.risposta ? 'Modifica risposta...' : 'Scrivi la tua risposta...'}">${q.risposta || ''}</textarea>
      <div class="answer-actions">
        <button class="btn-answer" data-id="${q.id}">Rispondi</button>
        <button class="btn-make-public" data-id="${q.id}" data-pubblica="${q.pubblica}">${q.pubblica ? 'Rendi privata' : 'Rendi pubblica'}</button>
      </div>
    </div>
  `;

  card.querySelector('.btn-answer').addEventListener('click', async () => {
    const text = card.querySelector('textarea').value.trim();
    if (!text) return;
    try {
      await sb(`review_questions?id=eq.${q.id}`, {
        method: 'PATCH',
        body: { risposta: text },
        headers: { 'Prefer': 'return=minimal' }
      });
      toast('Risposta salvata ✓');
      loadAdminQuestions();
    } catch(e) { toast('Errore', true); }
  });

  card.querySelector('.btn-make-public').addEventListener('click', async () => {
    const btn = card.querySelector('.btn-make-public');
    const newVal = btn.dataset.pubblica !== 'true';
    try {
      await sb(`review_questions?id=eq.${q.id}`, {
        method: 'PATCH',
        body: { pubblica: newVal },
        headers: { 'Prefer': 'return=minimal' }
      });
      toast(newVal ? 'Q&A resa pubblica ✓' : 'Q&A resa privata');
      loadAdminQuestions();
    } catch(e) { toast('Errore', true); }
  });

  return card;
}

// ── UTENTI ───────────────────────────────────────────
async function loadUsers() {
  const list = document.getElementById('users-list');
  list.innerHTML = '';
  try {
    const users = await sb('review_users?order=created_at.desc&select=*');
    users.forEach(u => {
      if (u.is_admin) return; // nascondi admin dalla lista
      const row = document.createElement('div');
      row.className = 'user-row';
      row.innerHTML = `
        <div class="user-email">${u.email}</div>
        <div class="user-nome">${u.nome || '-'}</div>
        <div class="user-pin">${u.pin}</div>
        <div><button class="btn-delete-user" data-id="${u.id}">Elimina</button></div>
      `;
      row.querySelector('.btn-delete-user').addEventListener('click', async () => {
        if (!confirm('Eliminare utente ' + u.email + '?')) return;
        try {
          await sb(`review_users?id=eq.${u.id}`, {
            method: 'DELETE',
            headers: { 'Prefer': 'return=minimal' }
          });
          row.remove();
          toast('Utente eliminato');
        } catch(e) { toast('Errore', true); }
      });
      list.appendChild(row);
    });
  } catch(e) { toast('Errore caricamento', true); }
}

document.getElementById('add-user-btn').addEventListener('click', async () => {
  const nome = document.getElementById('new-nome').value.trim();
  const email = document.getElementById('new-email').value.trim().toLowerCase();
  const pin = document.getElementById('new-pin').value.trim();
  if (!email || !pin) { toast('Email e PIN obbligatori', true); return; }
  try {
    await sb('review_users', {
      method: 'POST',
      body: { email, pin, nome, is_admin: false },
      headers: { 'Prefer': 'return=minimal' }
    });
    document.getElementById('new-nome').value = '';
    document.getElementById('new-email').value = '';
    document.getElementById('new-pin').value = '';
    toast('Utente aggiunto ✓');
    loadUsers();
  } catch(e) {
    toast('Errore (email già esistente?)', true);
  }
});
