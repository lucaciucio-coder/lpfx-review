<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LPFX Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050507;
    --bg2: #0A0A0D;
    --bg3: #111115;
    --bg4: #18181D;
    --border: rgba(212,175,55,0.12);
    --border2: rgba(212,175,55,0.25);
    --border3: rgba(212,175,55,0.4);
    --gold: #D4AF37;
    --gold2: #F0CB5A;
    --gold3: #B8962E;
    --gold-dim: rgba(212,175,55,0.10);
    --gold-dim2: rgba(212,175,55,0.06);
    --gold-glow: rgba(212,175,55,0.18);
    --red: #E84040;
    --red-dim: rgba(232,64,64,0.12);
    --green: #2DBE7A;
    --green-dim: rgba(45,190,122,0.12);
    --blue: #4A8FE8;
    --text: #F2EED8;
    --text2: #9A9278;
    --text3: #4A4538;
    --win: #2DBE7A;
    --loss: #E84040;
    --partial: #4A8FE8;
    --be: #D4AF37;
    --radius: 14px;
    --radius-sm: 9px;
    --radius-lg: 20px;
    --shadow: 0 4px 24px rgba(0,0,0,0.6);
    --shadow-gold: 0 0 24px rgba(212,175,55,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── CANVAS BACKGROUND ── */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.35;
    will-change: contents;
    transform: translateZ(0);
  }

  #login-screen, #app {
    position: relative;
    z-index: 1;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: rgba(10,10,13,0.85);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 52px 44px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: var(--shadow), var(--shadow-gold);
  }

  .login-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--gold2) 0%, var(--gold) 50%, var(--gold3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }

  .login-subtitle {
    color: var(--text2);
    font-size: 13px;
    margin-bottom: 40px;
    letter-spacing: 0.03em;
  }

  .login-card label {
    display: block;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .login-card input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    margin-bottom: 18px;
  }

  .login-card input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-dim);
  }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--gold2) 0%, var(--gold) 60%, var(--gold3) 100%);
    color: #050507;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    box-shadow: 0 4px 20px rgba(212,175,55,0.3);
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .login-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }

  /* ── APP SHELL ── */
  #app { display: none; }

  .topbar {
    height: 58px;
    background: rgba(5,5,7,0.92);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .topbar-logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--gold2), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.1em;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topbar-user {
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
  }

  .btn-logout {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 6px 14px;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .btn-logout:hover { border-color: var(--gold); color: var(--gold); }

  .main-content {
    max-width: 940px;
    margin: 0 auto;
    padding: 36px 28px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 3px;
    background: rgba(24,24,29,0.8);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 30px;
    backdrop-filter: blur(12px);
  }

  .tab-btn {
    flex: 1;
    padding: 9px 16px;
    border: none;
    background: none;
    color: var(--text2);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }

  .tab-btn.active {
    background: var(--gold-dim);
    color: var(--gold);
    box-shadow: inset 0 0 0 1px var(--border2);
  }

  /* ── TRADE CARD ── */
  .trades-grid { display: flex; flex-direction: column; gap: 14px; }

  .trade-card {
    background: rgba(10,10,13,0.7);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    contain: layout style;
  }

  .trade-card:hover {
    border-color: var(--border2);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 0 1px var(--gold-dim);
    transform: translateY(-1px);
  }

  .trade-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
  }

  .trade-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .trade-pair {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.04em;
  }

  .trade-dir {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .trade-dir.buy { background: var(--green-dim); color: var(--green); border: 1px solid rgba(45,190,122,0.25); }
  .trade-dir.sell { background: var(--red-dim); color: var(--red); border: 1px solid rgba(232,64,64,0.25); }

  .trade-result {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .trade-result.win { background: var(--green-dim); color: var(--win); border: 1px solid rgba(45,190,122,0.2); }
  .trade-result.loss { background: var(--red-dim); color: var(--loss); border: 1px solid rgba(232,64,64,0.2); }
  .trade-result.partial { background: rgba(74,143,232,0.12); color: var(--partial); border: 1px solid rgba(74,143,232,0.2); }
  .trade-result.be { background: var(--gold-dim); color: var(--be); border: 1px solid var(--border2); }

  .trade-date {
    font-size: 12px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.03em;
  }

  .trade-card-body { padding: 18px 22px; }

  .trade-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 16px;
    min-width: 0;
  }

  .stat-item { }

  .stat-label {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
    font-weight: 500;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .trade-fields { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .trade-field-row { display: flex; gap: 8px; }

  .field-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    min-width: 100px;
    flex-shrink: 0;
    padding-top: 1px;
  }

  .field-value {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
  }

  /* Immagini */
  .trade-images { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

  .trade-img-wrap { position: relative; cursor: pointer; }

  .trade-img-wrap img {
    width: 100px;
    height: 70px;
    object-fit: cover;
    border-radius: 7px;
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }

  .trade-img-wrap:hover img { border-color: var(--gold); }

  .img-tf-label {
    position: absolute;
    bottom: 4px;
    left: 4px;
    background: rgba(5,5,7,0.9);
    color: var(--gold);
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 5px;
    border-radius: 3px;
    font-weight: 600;
  }

  /* Reazioni */
  .reactions-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .reaction-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 13px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    color: var(--text2);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .reaction-btn:hover { border-color: var(--gold); background: var(--gold-dim2); }
  .reaction-btn.selected { border-color: var(--gold); background: var(--gold-dim); box-shadow: 0 0 8px var(--gold-dim); }

  .reaction-count {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text2);
  }

  /* Domande */
  .questions-section {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .questions-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .qa-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
  }

  .qa-question { font-size: 13px; color: var(--text); margin-bottom: 6px; }

  .qa-answer {
    font-size: 13px;
    color: var(--gold);
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }

  .qa-answer-label {
    font-size: 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .ask-question-area { display: flex; gap: 8px; margin-top: 10px; }

  .ask-question-area input {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .ask-question-area input:focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }

  .btn-ask {
    background: var(--gold-dim);
    border: 1px solid var(--gold);
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  .btn-ask:hover { background: var(--gold); color: #050507; }

  /* ── ADMIN ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .page-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    background: var(--gold-dim);
    color: var(--gold);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .badge.teal {
    background: var(--green-dim);
    color: var(--green);
    border-color: rgba(45,190,122,0.3);
  }

  .admin-trade-card {
    background: rgba(10,10,13,0.7);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 12px;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s;
  }

  .admin-trade-card:hover { border-color: var(--border2); }

  .admin-trade-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .btn-approve {
    background: var(--green-dim);
    border: 1px solid rgba(45,190,122,0.4);
    border-radius: 7px;
    padding: 7px 16px;
    color: var(--green);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-approve:hover { background: var(--green); color: #050507; }

  .btn-reject {
    background: var(--red-dim);
    border: 1px solid rgba(232,64,64,0.35);
    border-radius: 7px;
    padding: 7px 14px;
    color: var(--red);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-reject:hover { background: var(--red); color: #fff; }

  .btn-publish {
    background: var(--gold-dim);
    border: 1px solid var(--border2);
    border-radius: 7px;
    padding: 7px 16px;
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-publish:hover { background: var(--gold); color: #050507; }

  .btn-unpublish {
    background: rgba(74,143,232,0.08);
    border: 1px solid rgba(74,143,232,0.35);
    border-radius: 7px;
    padding: 7px 14px;
    color: var(--blue);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  /* Utenti */
  .user-table {
    background: rgba(10,10,13,0.7);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    backdrop-filter: blur(8px);
  }

  .user-table-head {
    display: grid;
    grid-template-columns: 1fr 1fr 120px 100px;
    padding: 12px 22px;
    background: rgba(24,24,29,0.8);
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
  }

  .user-row {
    display: grid;
    grid-template-columns: 1fr 1fr 120px 100px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
  }

  .user-row:last-child { border-bottom: none; }
  .user-row:hover { background: var(--gold-dim2); }

  .user-email { font-size: 13px; color: var(--text); }
  .user-nome { font-size: 13px; color: var(--text2); }
  .user-pin { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text3); }

  .btn-delete-user {
    background: none;
    border: 1px solid rgba(232,64,64,0.3);
    border-radius: 5px;
    padding: 4px 10px;
    color: var(--red);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-delete-user:hover { background: var(--red-dim); }

  .add-user-form {
    background: rgba(10,10,13,0.7);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 140px auto;
    gap: 12px;
    align-items: end;
    backdrop-filter: blur(8px);
  }

  .form-group label {
    display: block;
    font-size: 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    font-weight: 700;
  }

  .form-group input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-group input:focus { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }

  /* Domande admin */
  .question-admin-card {
    background: rgba(10,10,13,0.7);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 12px;
    backdrop-filter: blur(8px);
  }

  .qa-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

  .qa-trade-ref {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    background: var(--gold-dim);
    padding: 3px 9px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    font-weight: 600;
  }

  .qa-user-ref { font-size: 12px; color: var(--text3); }

  .qa-question-text { font-size: 14px; color: var(--text); margin-bottom: 12px; line-height: 1.5; }

  .answer-area { display: flex; gap: 8px; }

  .answer-area textarea {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
    min-height: 70px;
  }

  .answer-area textarea:focus { border-color: var(--gold); }

  .answer-actions { display: flex; flex-direction: column; gap: 6px; }

  .btn-answer {
    background: var(--gold-dim);
    border: 1px solid var(--border2);
    border-radius: 7px;
    padding: 8px 14px;
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  .btn-answer:hover { background: var(--gold); color: #050507; }

  .btn-make-public {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 14px;
    color: var(--text2);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }

  .btn-make-public:hover { border-color: var(--gold); color: var(--gold); }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,5,7,0.97);
    z-index: 999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  #lightbox.open { display: flex; }

  #lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 10px;
    user-select: none;
    -webkit-user-drag: none;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border2);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text2);
    font-size: 18px;
    z-index: 2;
    transition: all 0.2s;
  }

  .lightbox-close:hover { border-color: var(--gold); color: var(--gold); }

  .lightbox-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(24,24,29,0.8);
    border: 1px solid var(--border2);
    border-radius: 50%;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 22px;
    z-index: 2;
    transition: all 0.2s;
    user-select: none;
  }

  .lightbox-arrow:hover { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }
  .lightbox-arrow.prev { left: 20px; }
  .lightbox-arrow.next { right: 20px; }
  .lightbox-arrow.hidden { display: none; }

  .lightbox-counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(5,5,7,0.8);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 16px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text2);
  }

  .lightbox-tf {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(5,5,7,0.9);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    font-weight: 700;
  }

  /* Empty state */
  .empty-state { text-align: center; padding: 70px 20px; color: var(--text3); }
  .empty-state-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.5; }
  .empty-state-title { font-size: 16px; color: var(--text2); margin-bottom: 6px; font-weight: 600; }
  .empty-state-sub { font-size: 13px; }

  /* ── BADGE NUOVO ─────────────────────────────── */
  .badge-nuovo {
    display: inline-flex;
    align-items: center;
    background: var(--red);
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 2px 7px;
    border-radius: 20px;
    vertical-align: middle;
    margin-left: 6px;
    animation: badge-pulse 2s ease infinite;
    flex-shrink: 0;
  }
  @keyframes badge-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,64,64,0.5); }
    50% { box-shadow: 0 0 0 5px rgba(232,64,64,0); }
  }

  /* ── SKELETON LOADERS ─────────────────────────── */
  @keyframes sk-shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skeleton-card {
    pointer-events: none;
    border: 1px solid var(--border) !important;
    opacity: 0.7;
  }
  .sk-line {
    border-radius: 6px;
    background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%);
    background-size: 800px 100%;
    animation: sk-shimmer 1.4s ease infinite;
    margin-bottom: 10px;
  }
  .sk-line-header { height: 18px; width: 70%; }
  .sk-line-short  { height: 13px; width: 40%; }
  .sk-line-med    { height: 13px; width: 55%; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: rgba(10,10,13,0.95);
    border: 1px solid var(--gold);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    color: var(--gold);
    font-size: 13px;
    font-weight: 600;
    z-index: 1000;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 16px var(--gold-dim);
    backdrop-filter: blur(12px);
  }

  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.error { border-color: var(--red); color: var(--red); box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 16px rgba(232,64,64,0.15); }

  .section-divider { height: 1px; background: var(--border); margin: 24px 0; }

  /* Sync/action buttons */
  .btn-sync {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border2);
    border-radius: 7px;
    padding: 8px 16px;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.01em;
  }

  .btn-sync:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    box-shadow: 0 0 6px var(--green);
  }

  .admin-section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 9px;
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }

  .answered-badge {
    font-size: 11px;
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(45,190,122,0.3);
    border-radius: 10px;
    padding: 2px 9px;
    font-weight: 600;
  }

  .public-badge {
    font-size: 11px;
    background: var(--gold-dim);
    color: var(--gold);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 2px 9px;
    font-weight: 600;
  }

  @media (max-width: 600px) {
    .trade-stats { grid-template-columns: repeat(2, 1fr); }
    .add-user-form { grid-template-columns: 1fr; }
    .user-table-head { grid-template-columns: 1fr 80px 80px; }
    .user-row { grid-template-columns: 1fr 80px 80px; }
    .user-nome { display: none; }
  }

  /* ── MODALE ── */
  #trade-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,5,7,0.9);
    z-index: 200;
    overflow-y: auto;
    padding: 24px 16px;
    -webkit-overflow-scrolling: touch;
    backdrop-filter: blur(6px);
  }

  #trade-modal.open { display: flex; align-items: flex-start; justify-content: center; }

  .modal-inner {
    background: rgba(10,10,13,0.95);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 780px;
    padding: 32px;
    position: relative;
    margin: auto;
    box-shadow: var(--shadow), 0 0 40px rgba(212,175,55,0.08);
    backdrop-filter: blur(20px);
  }

  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text2);
    font-size: 16px;
    transition: all 0.2s;
  }

  .modal-close:hover { border-color: var(--gold); color: var(--gold); }

  .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; padding-right: 44px; }

  .modal-pair {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .modal-section { margin-bottom: 22px; }

  .modal-section-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .modal-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 22px;
  }

  .modal-stat .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; font-weight: 600; }
  .modal-stat .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700; }

  .modal-images { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }

  .modal-img-wrap {
    cursor: pointer;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: border-color 0.2s, transform 0.15s;
    flex: 1;
    min-width: 140px;
    max-width: 220px;
  }

  .modal-img-wrap:hover { border-color: var(--gold); transform: scale(1.02); }

  .modal-img-wrap img { width: 100%; height: 130px; object-fit: cover; display: block; }

  .modal-img-tf {
    position: absolute;
    bottom: 6px;
    left: 6px;
    background: rgba(5,5,7,0.9);
    color: var(--gold);
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border2);
  }

  .modal-field {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 8px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }

  .modal-field:last-child { border-bottom: none; }
  .modal-field-label { font-size: 12px; color: var(--text3); font-weight: 500; padding-top: 1px; }
  .modal-field-value { font-size: 13px; color: var(--text2); line-height: 1.6; }

  /* Chat */
  .qa-thread-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .qa-thread-item:hover { border-color: var(--border2); background: var(--gold-dim2); }
  .qa-thread-item.unread { border-color: rgba(232,64,64,0.4); }
  .qa-thread-left { flex: 1; }
  .qa-thread-user { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .qa-thread-preview { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  .qa-thread-arrow { color: var(--text3); font-size: 16px; }
  .qa-thread-badge { background: var(--red); color: #fff; border-radius: 10px; font-size: 10px; padding: 2px 7px; font-weight: 700; }

  #chat-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,5,7,0.97);
    z-index: 300;
    display: none;
    flex-direction: column;
    backdrop-filter: blur(8px);
  }

  #chat-overlay.open { display: flex; }

  .chat-header {
    background: rgba(10,10,13,0.95);
    border-bottom: 1px solid var(--border);
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chat-back {
    background: none;
    border: none;
    color: var(--gold);
    font-size: 20px;
    cursor: pointer;
    padding: 0 8px 0 0;
  }

  .chat-title { font-size: 15px; font-weight: 700; color: var(--text); transition: color 0.15s; }
  .chat-title[style*="cursor: pointer"]:hover { color: var(--gold2); }
  .chat-msg-ts {
    font-size: 10px;
    font-weight: 400;
    opacity: 0.5;
    margin-left: 6px;
    letter-spacing: 0;
  }
  .chat-subtitle { font-size: 12px; color: var(--text3); margin-top: 2px; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .chat-msg {
    max-width: 75%;
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.5;
  }

  .chat-msg.user-msg {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text2);
    align-self: flex-start;
    border-radius: 4px 14px 14px 14px;
  }

  .chat-msg.admin-msg {
    background: var(--gold-dim);
    border: 1px solid var(--border2);
    color: var(--text);
    align-self: flex-end;
    border-radius: 14px 4px 14px 14px;
  }

  .chat-msg-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
    opacity: 0.6;
  }

  .chat-input-area {
    background: rgba(10,10,13,0.95);
    border-top: 1px solid var(--border);
    padding: 16px 22px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .chat-input-area textarea {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    transition: border-color 0.2s;
  }

  .chat-input-area textarea:focus { border-color: var(--gold); }
  .chat-actions { display: flex; flex-direction: column; gap: 6px; }

  .modal-reactions {
    display: flex;
    gap: 8px;
    padding: 16px 0 12px;
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }

  /* Notifiche */
  .notif-banner {
    position: fixed;
    top: 68px;
    right: 22px;
    background: rgba(10,10,13,0.95);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 14px 20px;
    max-width: 300px;
    z-index: 150;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px var(--gold-dim);
    cursor: pointer;
    animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(12px);
  }

  @keyframes slideIn { from { transform: translateX(120%); opacity:0; } to { transform: translateX(0); opacity:1; } }
  .notif-title { font-size:13px; font-weight:700; color:var(--gold); margin-bottom:4px; }
  .notif-body { font-size:12px; color:var(--text2); }

  .notif-dot {
    width: 8px; height: 8px;
    background: var(--gold);
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
    box-shadow: 0 0 6px var(--gold);
  }

  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  .trade-card-clickable { cursor: pointer; }
  .trade-card-clickable .trade-card-header { transition: background 0.15s; }
  .trade-card-clickable:hover .trade-card-header { background: var(--gold-dim2); }

  .trade-result.setup-badge {
    background: rgba(154,146,120,0.12);
    color: var(--text2);
    border: 1px solid rgba(154,146,120,0.2);
  }

  .modal-loading-imgs {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text3);
    font-size: 13px;
    padding: 12px 0;
  }

  .img-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .open-detail-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

  @media (max-width: 600px) {
    .modal-stats { grid-template-columns: repeat(2, 1fr); }
    .modal-inner { padding: 22px 18px; }
  }

  /* ═══════════════════════════════════════════
     MOBILE RESPONSIVE (max 768px)
  ═══════════════════════════════════════════ */
  @media (max-width: 768px) {
    .topbar { padding: 0 16px; height: 52px; }
    .topbar-logo { font-size: 14px; }
    .topbar-user { display: none; }
    .btn-logout { padding: 5px 10px; font-size: 11px; }
    .main-content { padding: 16px 14px; }
    .login-card { padding: 36px 24px; }
    .login-logo { font-size: 20px; }
    .tabs { padding: 3px; gap: 2px; }
    .tab-btn { padding: 7px 8px; font-size: 11px; }
    .trade-card-header { padding: 14px 16px 10px; }
    .trade-pair { font-size: 14px; }
    .trade-card-body { padding: 14px 16px; }
    .trade-stats { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .stat-value { font-size: 13px; }
    .open-detail-hint { font-size: 10px; }
    .reaction-btn { padding: 5px 10px; font-size: 14px; }
    .reaction-count { font-size: 11px; }
    #trade-modal { padding: 0; align-items: flex-end; backdrop-filter: none; }
    .modal-inner { border-radius: 20px 20px 0 0; padding: 22px 18px 36px; max-height: 92vh; overflow-y: auto; width: 100%; max-width: 100%; }
    .modal-close { top: 14px; right: 14px; }
    .modal-header { margin-bottom: 18px; }
    .modal-pair { font-size: 20px; }
    .modal-stats { grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
    .modal-stat .stat-value { font-size: 15px; }
    .modal-images { gap: 8px; }
    .modal-img-wrap { min-width: 120px; max-width: none; flex: 1; }
    .modal-img-wrap img { height: 110px; }
    .modal-field { grid-template-columns: 100px 1fr; gap: 6px; padding: 8px 0; }
    .modal-field-label { font-size: 11px; }
    .modal-field-value { font-size: 12px; }
    .lightbox-arrow { width: 38px; height: 38px; font-size: 19px; }
    .lightbox-arrow.prev { left: 8px; }
    .lightbox-arrow.next { right: 8px; }
    .admin-trade-card { padding: 14px 16px; }
    .admin-trade-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .admin-actions { width: 100%; display: flex; gap: 8px; }
    .btn-approve, .btn-reject, .btn-publish, .btn-unpublish { flex: 1; text-align: center; font-size: 12px; padding: 8px 6px; }
    .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .btn-sync { font-size: 12px; padding: 7px 12px; }
    .add-user-form { grid-template-columns: 1fr; gap: 8px; }
    .user-table-head { grid-template-columns: 1fr 70px 60px; font-size: 10px; padding: 10px 14px; }
    .user-row { grid-template-columns: 1fr 70px 60px; padding: 12px 14px; }
    .user-nome { display: none; }
    .user-email { font-size: 12px; }
    .user-pin { font-size: 11px; }
    .btn-delete-user { font-size: 11px; padding: 3px 7px; }
    .qa-thread-item { padding: 10px 12px; }
    .qa-thread-preview { max-width: 200px; font-size: 11px; }
    .chat-header { padding: 12px 16px; }
    .chat-messages { padding: 14px; gap: 10px; }
    .chat-msg { max-width: 85%; font-size: 12px; padding: 8px 12px; }
    .chat-input-area { padding: 12px; }
    .notif-banner { right: 10px; left: 10px; max-width: none; }
    .qa-item { padding: 10px 12px; }
    .qa-question { font-size: 12px; }
    .qa-answer { font-size: 12px; }
    .ask-question-area { gap: 6px; }
    .ask-question-area input { font-size: 12px; padding: 8px 10px; }
    .btn-ask { padding: 8px 12px; font-size: 12px; }
    .question-admin-card { padding: 12px 14px; }
    .answer-area { flex-direction: column; }
    .answer-actions { flex-direction: row; flex-wrap: wrap; }
    .modal-reactions { gap: 6px; flex-wrap: wrap; }
    .empty-state { padding: 44px 16px; }
    .empty-state-icon { font-size: 34px; }
  }

  @media (max-width: 380px) {
    .tab-btn { padding: 6px 4px; font-size: 10px; letter-spacing: 0; }
    .trade-pair { font-size: 13px; }
    .modal-stats { grid-template-columns: repeat(2, 1fr); }
  }

</style>
</head>
<body>

<!-- ANIMATED BACKGROUND CANVAS -->
<canvas id="bg-canvas"></canvas>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">LPFX REVIEW</div>
    <div class="login-subtitle">Accedi per vedere i trade</div>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="la tua email" autocomplete="email">
    <label>PIN</label>
    <input type="password" id="login-pin" placeholder="••••••••" autocomplete="current-password">
    <button class="btn-primary" id="login-btn">Accedi</button>
    <div class="login-error" id="login-error">Email o PIN non corretti</div>
  </div>
</div>

<!-- APP -->

// ── API ──────────────────────────────────────────────
async function sb(path, opts = {}, useKey = LEGACY_KEY) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 12000); // 12s max
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
      signal: controller.signal,
      headers: {
        'apikey': useKey,
        'Authorization': 'Bearer ' + useKey,
        'Content-Type': 'application/json',
        'Prefer': opts.prefer || 'return=representation',
        ...opts.headers
      },
      method: opts.method || 'GET',
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    // Gestisci risposta vuota (204 o body vuoto)
    if (res.status === 204) return null;
    const text = await res.text();
    if (!text || text.trim() === '') return null;
    const data = JSON.parse(text);
    if (!res.ok) throw new Error(typeof data === 'object' ? (data.message || JSON.stringify(data)) : text);
    return data;
  } finally {
    clearTimeout(timeout);
  }
}

function parseChatParts(raw) {
  // Splitta su \n---\n, estrae timestamp e testo
  return (raw || '').split('\n---\n').map((part) => {
    const tsMatch = part.match(/^\[(.+?)\]\s*/);
    if (tsMatch) {
      return { ts: tsMatch[1], text: part.replace(/^\[.+?\]\s*/, ''), hasTs: true };
    }
    return { ts: null, text: part, hasTs: false };
  });
}

// Converte timestamp "dd/mm, HH:MM" in numero comparabile per ordinamento
function parseTsToNum(ts) {
  if (!ts) return 0;
  // formato: "25/09, 10:24"
  const m = ts.match(/^(\d{2})\/(\d{2}),\s*(\d{2}):(\d{2})$/);
  if (!m) return 0;
  const [, dd, mm, hh, min] = m;
  // usa anno corrente — solo per confronto relativo
  return parseInt(mm) * 100000 + parseInt(dd) * 1000 + parseInt(hh) * 100 + parseInt(min);
}

function renderChatMessages(q) {
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';

  const userName = q._userName || 'Utente';

  const dParts = parseChatParts(q.domanda);
  const rParts = parseChatParts(q.risposta);

  // Costruisce timeline unificata con ordinamento cronologico corretto.
  // Il primo messaggio utente (D0) è sempre primo: sortKey = 0.
  // Il primo messaggio admin (R0) è la prima risposta: sortKey = 0.5 (dopo D0, prima dei follow-up).
  // I follow-up successivi hanno timestamp reali → li usiamo per ordinare.
  // Se due messaggi hanno lo stesso timestamp, utente < admin (convenzione).

  const timeline = [];

  dParts.forEach((p, i) => {
    let sortKey;
    if (i === 0) {
      sortKey = 0; // domanda originale → sempre prima
    } else {
      sortKey = p.ts ? parseTsToNum(p.ts) - 0.1 : 0.4 + i * 0.001; // user leggermente prima se stesso ts
    }
    timeline.push({ ...p, role: 'user', sortKey });
  });

  rParts.forEach((p, i) => {
    let sortKey;
    if (i === 0) {
      sortKey = 0.5; // prima risposta → dopo D0, prima dei follow-up con ts
    } else {
      sortKey = p.ts ? parseTsToNum(p.ts) : 0.6 + i * 0.001;
    }
    timeline.push({ ...p, role: 'admin', sortKey });
  });

  // Ordina cronologicamente
  timeline.sort((a, b) => a.sortKey - b.sortKey);

  // Render
  const frag = document.createDocumentFragment();
  timeline.forEach(msg => {
    if (!msg.text && msg.text !== '0') return; // salta vuoti
    const el = document.createElement('div');
    el.className = msg.role === 'user' ? 'chat-msg user-msg' : 'chat-msg admin-msg';
    const senderName = msg.role === 'user' ? userName : 'Luca';
    const tsHtml = msg.ts ? `<span class="chat-msg-ts">${msg.ts}</span>` : '';
    el.innerHTML = `<div class="chat-msg-label">${senderName}${tsHtml}</div>${msg.text}`;
    frag.appendChild(el);
  });
  msgs.appendChild(frag);

  msgs.scrollTop = msgs.scrollHeight;

  // Input sempre visibile
  document.getElementById('chat-input-area').style.display = 'flex';
  const inputEl = document.getElementById('chat-input');
  inputEl.placeholder = chatContext.isAdmin ? 'Scrivi risposta...' : 'Aggiungi un messaggio...';
  inputEl.value = '';
}

document.getElementById('chat-back').addEventListener('click', () => {
  document.getElementById('chat-overlay').classList.remove('open');
  chatContext = null;
});

document.getElementById('chat-send').addEventListener('click', async () => {
  if (!chatContext) return;
  const inputEl = document.getElementById('chat-input');
  const text = inputEl.value.trim();
  if (!text) return;

  const btn = document.getElementById('chat-send');
  btn.disabled = true;

  try {
    const now = new Date();
    const ts = now.toLocaleString('it-IT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });

    if (chatContext.isAdmin) {
      // Admin → append alla risposta (thread stile chat)
      const existing = chatContext.q.risposta || '';
      const nuovaRisposta = existing
        ? existing + '\n---\n[' + ts + '] ' + text
        : text;
      await sb(`review_questions?id=eq.${chatContext.q.id}`, {
        method: 'PATCH',
        body: { risposta: nuovaRisposta, letta_utente: false },
        headers: { 'Prefer': 'return=minimal' }
      });
      // Notifica utente
      await sb('review_notifications', {
        method: 'POST',
        body: {
          user_id: chatContext.q.user_id,
          trade_id: chatContext.q.trade_id,
          question_id: chatContext.q.id,
          messaggio: 'Luca ha risposto alla tua domanda',
          letta: false
        },
        headers: { 'Prefer': 'return=minimal' }
      }).catch(() => {});
      chatContext.q.risposta = nuovaRisposta;
      toast('Risposta inviata ✓');
      loadAdminQuestions();
    } else {
      // Utente → append follow-up alla domanda
      const nuovaDomanda = chatContext.q.domanda + '\n---\n[' + ts + '] ' + text;
      await sb(`review_questions?id=eq.${chatContext.q.id}`, {
        method: 'PATCH',
        body: { domanda: nuovaDomanda, letta_admin: false },
        headers: { 'Prefer': 'return=minimal' }
      });
      chatContext.q.domanda = nuovaDomanda;
      toast('Messaggio inviato ✓');
    }
    // Svuota campo e re-render
    inputEl.value = '';
    renderChatMessages(chatContext.q);
  } catch(e) { toast('Errore', true); }
  finally { btn.disabled = false; }
});

// ── LIGHTBOX ─────────────────────────────────────────
// ── LIGHTBOX CON NAVIGAZIONE ────────────────────────
let lightboxImages = []; // array di {src, tf}
let lightboxIndex = 0;

function openLightbox(images, startIndex) {
  lightboxImages = images;
  lightboxIndex = startIndex;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
}

function renderLightbox() {
  const img = document.getElementById('lightbox-img');
  const prev = document.getElementById('lightbox-prev');
  const next = document.getElementById('lightbox-next');
  const counter = document.getElementById('lightbox-counter');
  const tfLabel = document.getElementById('lightbox-tf');

  const current = lightboxImages[lightboxIndex];
  img.src = current.src || current.url || current;
  img.alt = current.tf || '';

  // Counter
  if (lightboxImages.length > 1) {
    counter.style.display = 'block';
    counter.textContent = (lightboxIndex + 1) + ' / ' + lightboxImages.length;
    prev.classList.toggle('hidden', lightboxIndex === 0);
    next.classList.toggle('hidden', lightboxIndex === lightboxImages.length - 1);
  } else {
    counter.style.display = 'none';
    prev.classList.add('hidden');
    next.classList.add('hidden');
  }

  // TF label
  if (current.tf || current.label) {
    tfLabel.style.display = 'block';
    tfLabel.textContent = current.tf || current.label;
  } else {
    tfLabel.style.display = 'none';
  }
}

document.getElementById('lightbox-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  if (lightboxIndex > 0) { lightboxIndex--; renderLightbox(); }
});

document.getElementById('lightbox-next').addEventListener('click', (e) => {
  e.stopPropagation();
  if (lightboxIndex < lightboxImages.length - 1) { lightboxIndex++; renderLightbox(); }
});

document.getElementById('lightbox-close').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox') || e.target === document.getElementById('lightbox-img')) {
    document.getElementById('lightbox').classList.remove('open');
  }
});

// Tasti freccia
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowLeft' && lightboxIndex > 0) { lightboxIndex--; renderLightbox(); }
  if (e.key === 'ArrowRight' && lightboxIndex < lightboxImages.length - 1) { lightboxIndex++; renderLightbox(); }
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// Swipe touch
let touchStartX = 0;
document.getElementById('lightbox').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.getElementById('lightbox').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) < 50) return;
  if (dx < 0 && lightboxIndex < lightboxImages.length - 1) { lightboxIndex++; renderLightbox(); }
  if (dx > 0 && lightboxIndex > 0) { lightboxIndex--; renderLightbox(); }
}, { passive: true });

// Chiusura modale trade
document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('trade-modal').classList.remove('open');
});

document.getElementById('trade-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('trade-modal')) {

});

document.addEventListener('click', e => {

async function loadUserTrades() {
  const list = document.getElementById('user-trades-list');
  // Skeleton loaders per feedback immediato
  list.innerHTML = Array(4).fill(0).map(() => `
    <div class="trade-card skeleton-card">
      <div class="sk-line sk-line-header"></div>
      <div class="sk-line sk-line-short"></div>
      <div class="sk-line sk-line-med"></div>
    </div>`).join('');
  // Controlla notifiche in parallelo (non blocca)
  checkNotifiche();
  try {
    // 1. Carica i trade
    const trades = await sb('review_trades?pubblicato=eq.true&order=data.desc&select=*');
    if (!trades || trades.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-title">Nessun trade ancora pubblicato</div><div class="empty-state-sub">Torna presto</div></div>';
      return;
    }

    // 2. Batch fetch: tutte le reazioni + domande in parallelo (3 query totali invece di N×3)
    const ids = trades.map(t => t.id);
    const idsParam = `(${ids.map(id => `"${id}"`).join(',')})`;

    const [allReactions, pubQs, myQs] = await Promise.all([
      sb(`review_reactions?trade_id=in.${idsParam}&select=trade_id,emoji,user_id`),
      sb(`review_questions?trade_id=in.${idsParam}&pubblica=eq.true&select=*`),
      sb(`review_questions?trade_id=in.${idsParam}&user_id=eq.${currentUser.id}&select=*`)
    ]);

    // 3. Raggruppa lato client per trade_id
    const reactionsMap = {};
    const pubQsMap = {};
    const myQsMap = {};
    ids.forEach(id => { reactionsMap[id] = []; pubQsMap[id] = []; myQsMap[id] = []; });
    (allReactions || []).forEach(r => { if (reactionsMap[r.trade_id]) reactionsMap[r.trade_id].push(r); });
    (pubQs || []).forEach(q => { if (pubQsMap[q.trade_id]) pubQsMap[q.trade_id].push(q); });
    (myQs || []).forEach(q => { if (myQsMap[q.trade_id]) myQsMap[q.trade_id].push(q); });

    // 4. Render immediato con DocumentFragment (un solo reflow)
    const frag = document.createDocumentFragment();
    for (const t of trades) {
      const reactions = reactionsMap[t.id] || [];
      const myEmojis = new Set(reactions.filter(r => r.user_id === currentUser.id).map(r => r.emoji));
      const myReaction = myEmojis.size > 0 ? { emoji: [...myEmojis] } : null;
      const counts = { '💪': 0, '🔥': 0, '👍': 0 };
      reactions.forEach(r => { if (counts[r.emoji] !== undefined) counts[r.emoji]++; });
      frag.appendChild(buildUserTradeCard(t, counts, myReaction, pubQsMap[t.id] || [], myQsMap[t.id] || []));
    }
    list.innerHTML = '';
    list.appendChild(frag);

    // 5. Salva timestamp visita DOPO il render (la prossima sessione vedrà questi trade come "vecchi")
    saveLastVisit(currentUser.id);
  } catch(e) {
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-title">Errore caricamento</div></div>';
  }
}

// Cache trade data per la modale
const tradeCache = {};

// ── BADGE "NUOVO" sui trade ───────────────────────────
// Logica: un trade è NUOVO se è stato pubblicato DOPO l'ultima visita dell'utente.
// "Ultima visita" = timestamp salvato in localStorage al momento del caricamento dei trade.
// Quando l'utente apre il trade lo segna come visto (salva il suo id in un set separato).

function getLastVisit(userId) {
  try {
    return localStorage.getItem('lpfx_last_visit_' + userId) || null;
  } catch { return null; }
}

function saveLastVisit(userId) {
  try {
    localStorage.setItem('lpfx_last_visit_' + userId, new Date().toISOString());
  } catch {}
}

function getSeenTrades(userId) {
  try {
    return new Set(JSON.parse(localStorage.getItem('lpfx_seen_' + userId) || '[]'));
  } catch { return new Set(); }
}

function markTradeAsSeen(tradeId) {
  if (!currentUser) return;
  try {
    const seen = getSeenTrades(currentUser.id);
    seen.add(tradeId);
    const arr = [...seen].slice(-500);
    localStorage.setItem('lpfx_seen_' + currentUser.id, JSON.stringify(arr));
  } catch {}
}

function isTradeNew(trade) {
  if (!currentUser) return false;
  // Se già aperto → non nuovo
  if (getSeenTrades(currentUser.id).has(trade.id)) return false;
  // Se non c'è una visita precedente → tutti i trade esistenti NON sono nuovi (prima volta in assoluto)
  const lastVisit = getLastVisit(currentUser.id);
  if (!lastVisit) return false;
  // Nuovo = pubblicato dopo l'ultima visita
  return trade.created_at && new Date(trade.created_at) > new Date(lastVisit);
}

async function loadModalImages(journalTradeId) {
  const loading = document.getElementById('modal-imgs-loading');
  const container = document.getElementById('modal-imgs-container');
  const section = document.getElementById('modal-images-section');
  if (!loading || !container) return;

  try {
    // journal_trade_id è numerico/stringa — cerca con cast
    const rows = await sb(
      `journal_trades?id=eq.${journalTradeId}&select=images`,
      {}, LEGACY_KEY
    );
    if (!rows || rows.length === 0) {
      if (section) section.style.display = 'none';
      return;
    }
    const images = rows[0].images || [];
    if (images.length === 0) {
      if (section) section.style.display = 'none';
      return;
    }
    container.innerHTML = images.map(img => {
      // Campo src può essere src, url, o data (base64)
      const src = img.src || img.url || img.data || '';
      if (!src) return '';
      const tf = img.tf || img.label || img.timeframe || '';
      return `<div class="modal-img-wrap" data-src="${src}">
        <img src="${src}" alt="${tf}" loading="lazy">
        ${tf ? `<div class="modal-img-tf">${tf}</div>` : ''}
      </div>`;
    }).join('');

    // Riattacca lightbox con navigazione
    const imgWraps = container.querySelectorAll('.modal-img-wrap[data-src]');
    imgWraps.forEach((wrap, idx) => {
      wrap.addEventListener('click', () => {
        openLightbox(images, idx);
      });
    });

    loading.style.display = 'none';
    container.style.display = 'flex';
  } catch(e) {
    if (section) section.style.display = 'none';
  }
}

async function handleReaction(btn, tradeId) {
  const emoji = btn.dataset.emoji;
  const isSelected = btn.classList.contains('selected');

  try {
    if (isSelected) {
      // Rimuovi solo questa emoji specifica
      await fetch(

// Sync dal journal
document.getElementById('sync-btn').addEventListener('click', syncFromJournal);

async function syncFromJournal() {
  const btn = document.getElementById('sync-btn');
  btn.textContent = '⟳ Sincronizzazione...';
  btn.disabled = true;

  try {
    // Prendi tutti i trade dal journal NON setup, solo campi necessari (NO images)
    const journalTrades = await sb(
      'journal_trades?select=id,pair,date,direction,result,pnl,rr,setup,tf,tf_analysis,entry,sl,tp,lesson,emotion,altro,is_setup&order=created_at.asc',
      {}, LEGACY_KEY
    );

    if (!journalTrades || journalTrades.length === 0) {
      toast('Nessun trade trovato nel journal');
      return;
    }

    // Prendi gli id già importati
    const existing = await sb('review_trades?select=journal_trade_id');
    const existingIds = new Set(existing.map(e => String(e.journal_trade_id)));

    let newCount = 0;
    let errCount = 0;

    for (const jt of journalTrades) {
      const jid = String(jt.id);
      if (existingIds.has(jid)) continue;

      const payload = {
        journal_trade_id: jid,
        pair: jt.pair || null,
        data: jt.date || null,
        direzione: jt.direction || null,
        risultato: jt.result || (jt.is_setup ? 'setup' : null),
        pnl: (jt.pnl !== undefined && jt.pnl !== null) ? jt.pnl : null,
        rr: jt.rr || null,
        setup: jt.setup || null,
        tf_entry: jt.tf || null,
        tf_analisi: jt.tf_analysis || null,
        motivo_entry: jt.entry || null,
        stop_loss: jt.sl || null,
        tp_gestione: jt.tp || null,
        errori_lezioni: jt.lesson || null,
        stato_emotivo: jt.emotion || null,
        altro: jt.altro || null,
        immagini: [],
        approvato: false,
        pubblicato: false
      };

      try {
        await sb('review_trades', {
          method: 'POST',
          body: payload,
          headers: { 'Prefer': 'return=minimal' }
        });
        newCount++;
      } catch(e) {
        errCount++;
        console.warn('Errore trade ' + jid + ':', e.message);
      }
    }

    if (newCount > 0) {
      toast(newCount + ' trade importati ✓' + (errCount > 0 ? ' (' + errCount + ' errori)' : ''));
    } else if (errCount > 0) {
      toast('Errori su ' + errCount + ' trade', true);
    } else {
      toast('Tutto già aggiornato');
    }
    loadAdminPending();
  } catch(e) {
    toast('Errore sync: ' + e.message, true);
  } finally {
    btn.textContent = '⟳ Sincronizza Journal';
    btn.disabled = false;
  }
}

<!-- CANVAS BACKGROUND: candlestick chart animation -->
<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');

  const GOLD = '#D4AF37';
  const GREEN = '#2DBE7A';
  const RED = '#E84040';
  const GRID = 'rgba(212,175,55,0.06)';

  let W, H;
  let candles = [];
  let lines = [];
  let frame = 0;
  const CANDLE_W = 18;
  const CANDLE_GAP = 10;
  const STEP = CANDLE_W + CANDLE_GAP;
  let scrollX = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initCandles();
  }

  function randBetween(a, b) { return a + Math.random() * (b - a); }

  function generateCandle(x, prevClose) {
    const isBull = Math.random() > 0.42;
    const range = randBetween(20, 80);
    const body = randBetween(range * 0.3, range * 0.75);
    const open = prevClose || randBetween(H * 0.3, H * 0.7);
    const close = isBull ? open + body : open - body;
    const high = Math.max(open, close) + randBetween(4, range * 0.35);
    const low = Math.min(open, close) - randBetween(4, range * 0.35);
    return { x, open, close, high, low, isBull };
  }

  function initCandles() {
    candles = [];
    const count = Math.ceil(W / STEP) + 20;
    let prev = H * 0.5;
    for (let i = 0; i < count; i++) {
      const c = generateCandle(i * STEP, prev);
      prev = c.close;
      candles.push(c);
    }
    // moving average line points
    generateLine();
  }

  function generateLine() {
    lines = [];
    for (let i = 0; i < candles.length; i++) {
      const avg = candles.slice(Math.max(0, i - 8), i + 1).reduce((s, c) => s + (c.open + c.close) / 2, 0) / Math.min(i + 1, 9);
      lines.push({ x: candles[i].x, y: avg });
    }
  }

  function drawGrid() {
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    const rows = 6;
    for (let i = 0; i <= rows; i++) {
      const y = (H / rows) * i;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    const cols = Math.ceil(W / 80);
    for (let i = 0; i <= cols; i++) {
      const x = (W / cols) * i;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
  }

  function drawCandle(c, ox) {
    const x = c.x - ox;
    if (x < -CANDLE_W - 10 || x > W + 20) return;

    const col = c.isBull ? GREEN : RED;
    ctx.strokeStyle = col;
    ctx.fillStyle = c.isBull ? 'rgba(45,190,122,0.55)' : 'rgba(232,64,64,0.55)';
    ctx.lineWidth = 1;

    // wick
    ctx.beginPath();
    ctx.moveTo(x + CANDLE_W / 2, c.high);
    ctx.lineTo(x + CANDLE_W / 2, c.low);
    ctx.stroke();

    // body
    const top = Math.min(c.open, c.close);
    const h = Math.max(Math.abs(c.close - c.open), 2);
    ctx.fillRect(x, top, CANDLE_W, h);
    ctx.strokeRect(x, top, CANDLE_W, h);
  }

  function drawMA(ox) {
    if (lines.length < 2) return;
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(212,175,55,0.5)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    let started = false;
    for (let i = 0; i < lines.length; i++) {
      const x = lines[i].x - ox;
      if (x < -20 || x > W + 20) continue;
      if (!started) { ctx.moveTo(x, lines[i].y); started = true; }
      else ctx.lineTo(x, lines[i].y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function appendCandle() {
    const last = candles[candles.length - 1];
    const c = generateCandle(last.x + STEP, last.close);
    candles.push(c);
    // prune far-left
    if (candles[0].x - scrollX < -200) candles.shift();
    generateLine();
  }

  const FPS_CAP = 30;
  const FRAME_MS = 1000 / FPS_CAP;
  let lastFrameTime = 0;
  let rafId = null;
  let paused = false;

  function draw(ts) {
    rafId = requestAnimationFrame(draw);
    if (paused) return;
    if (ts - lastFrameTime < FRAME_MS) return;
    lastFrameTime = ts;

    ctx.clearRect(0, 0, W, H);
    drawGrid();
    candles.forEach(c => drawCandle(c, scrollX));
    drawMA(scrollX);
    frame++;

    // slow scroll
    scrollX += 0.25;
    // add new candle when the last one scrolls into view
    const lastX = candles[candles.length - 1].x - scrollX;
    if (lastX < W + 60) appendCandle();
  }

  // Pausa quando la tab è in background
  document.addEventListener('visibilitychange', () => {
    paused = document.hidden;
  });

  window.addEventListener('resize', resize);
  resize();
  draw();
})();
</script>
</body>
</html>
